<html>
	<head>
		<meta charset="UTF-8">
		<title>Sort Algorithms</title>
		<link rel="stylesheet" href="style.css">
	</head>

	<body>
		<form method="get">
            <label for="size">List size:</label> <input type="number" value="100" id="size" name="list_size">
            <div class="box"> 
				<label for="allow-negatives">Negative numbers</label>
				<input checked type="checkbox" value="negative" id="allow-negatives" name="allow_negatives"> <br>
            </div>

            <label for="data-style">Type of data:</label>
			<select id="data-style" name="data_style">
                <option value="already_sorted" selected>Already sorted</option>
                <option value="reverse_sorted">Reverse sorted</option>
                <option value="totally_random">Totally random</option>
                <option value="nearly_sorted">Nearly sorted</option>
            </select>

			<label for="speed-control">Speed: <strong id="speed-value">120</strong> FPS</label>
			<input type="range" min="1" max="500" value="120" id="speed-control" name="speed_control">
        </form>

		<div class="algorithms-grid">
			<button type="button" class="algo-btn" data-algo="bubble_sort">
				Bubble Sort
			</button>

			<button type="button" class="algo-btn" data-algo="bucket_sort">
				Bucket Sort
			</button>

			<button type="button" class="algo-btn" data-algo="cocktail_sort">
				Cocktail Sort
			</button>

			<button type="button" class="algo-btn" data-algo="comb_sort">
				Comb Sort
			</button> 

			<button type="button" class="algo-btn" data-algo="counting_sort">
				Counting Sort
			</button>

			<button type="button" class="algo-btn" data-algo="double_selection_sort">
				Double Selection Sort
			</button> 

			<button type="button" class="algo-btn" data-algo="gnome_sort">
				Gnome Sort
			</button> 

			<!--
			<button type="button" class="algo-btn" data-algo="gravity_sort">
				Gravity Sort
			</button> 
			-->

			<button type="button" class="algo-btn" data-algo="heap_sort">
				Heap Sort
			</button>

			<button type="button" class="algo-btn" data-algo="i_cant_believe_it_can_sort">
				I can't believe it can sort
			</button>

			<button type="button" class="algo-btn" data-algo="insertion_sort">
				Insertion Sort
			</button>
			
			<button type="button" class="algo-btn" data-algo="merge_sort">
				Merge Sort
			</button>

			<button type="button" class="algo-btn" data-algo="odd_even_sort">
				Odd Even Sort
			</button> 

			<!--
			<button type="button" class="algo-btn" data-algo="pancake_sort">
				Pancake Sort
			</button> 
			-->
			
			<button type="button" class="algo-btn" data-algo="quick_sort">
				Quick Sort
			</button>
			
			<button type="button" class="algo-btn" data-algo="radix_sort">
				Radix Sort
			</button>
			
			<button type="button" class="algo-btn" data-algo="selection_sort">
				Selection Sort
			</button>
			
			<button type="button" class="algo-btn" data-algo="shell_sort">
				Shell Sort
			</button>

			<!--
			<button type="button" class="algo-btn" data-algo="stooge_sort">
				Stooge Sort
			</button> 
			-->
			
			<button type="button" class="algo-btn" data-algo="tim_sort">
				Tim Sort
			</button>
		</div>

		<button type="button" name="benchmark" id="benchmark-btn">Benchmark</button>
		<section id="benchmark-results"></section>

		<script src="script.js"></script>
	</body>
</html>
